<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wachtwoord instellen - MPOP</title>
  <link rel="stylesheet" href="styles.css">
  <style>main { max-width:560px; margin:36px auto; }</style>
</head>
<body>
<main>
  <h1 id="passwordHeading">Wachtwoord instellen</h1>
  <div class="card">
    <p id="introText" class="muted">Open deze pagina via je uitnodigings- of herstelmail.</p>
    <p id="accountEmail"></p>
    <form id="resetForm">
      <label for="newPassword">Nieuw wachtwoord (minimaal 8 tekens)</label>
      <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required disabled>
      <label for="confirmPassword">Herhaal het nieuwe wachtwoord</label>
      <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required disabled>
      <div class="btnrow mt-10"><button type="submit" disabled>Wachtwoord opslaan</button></div>
    </form>
    <p id="resetMsg" role="status" aria-live="polite"></p>
    <p><a href="index.html">Terug naar de editor / inloggen</a></p>
  </div>
</main>
<script type="module">
  const message = document.getElementById("resetMsg");
  const timeout = setTimeout(() => {
    message.textContent = "Laden duurt te lang. Controleer je internetverbinding en open de mail-link opnieuw.";
  }, 20000);
  import("./auth-password.js?v=20261005-config-fix").catch(() => {
    message.textContent = "De wachtwoordpagina kon niet worden geladen. Laat de beheerder de websitebestanden controleren.";
  }).finally(() => clearTimeout(timeout));
</script>
</body>
</html>
